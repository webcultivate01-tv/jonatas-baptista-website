<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — Jonatas Baptista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark: #0e1117;
      --dark-card: #1c2232;
      --red: #c0392b;
      --red-h: #e74c3c;
      --off-white: #f4f3ef;
      --text-mid: #9aa1af;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      background: var(--dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--dark-card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
    }
    .login-logo {
      display: block;
      height: 64px;
      width: auto;
      margin: 0 auto 1.5rem;
    }
    .login-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.9rem;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-mid);
      margin-bottom: 2rem;
    }
    .field { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
      margin-bottom: 0.5rem;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      color: #fff;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      outline: none;
      border-color: var(--red);
      background: rgba(255,255,255,0.08);
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 2.75rem;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 0.9rem;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0.25rem;
      cursor: pointer;
      color: var(--text-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-password:hover { color: #fff; }
    .toggle-password svg { width: 20px; height: 20px; }
    .forgot-row {
      text-align: right;
      margin-bottom: 1.75rem;
    }
    .forgot-row a {
      font-size: 0.85rem;
      color: var(--text-mid);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-row a:hover { color: var(--red-h); }
    .btn-login {
      width: 100%;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-login:hover { background: var(--red-h); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="../image/jb-logo.png" alt="Jonatas Baptista" class="login-logo" />
    <h1 class="login-title">Admin Login</h1>
    <p class="login-subtitle">Sign in to manage the site</p>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div class="forgot-row">
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn-login">Log In</button>
    </form>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
    const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.66M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
